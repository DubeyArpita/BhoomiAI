name: BhoomiAI static validation
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  backend-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m compileall -q backend/app backend/scripts
  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
  backend-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --upgrade pip
          python -m pip install pytest fastapi "psycopg[binary]" itsdangerous python-dotenv python-multipart httpx numpy rasterio Pillow openpyxl
      - run: python -m pytest -q backend/tests

  inspect-public-dilrmp-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install openpyxl
      - run: python backend/scripts/inspect_dilrmp.py --dir "datasets/dilrmp/Uttar Pradesh/ghaziabad"
